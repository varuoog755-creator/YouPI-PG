# YOUPI PG — Render deployment blueprint
#
# One-click deploy: Render dashboard -> New + -> Blueprint -> pick this repo.
#
# Cross-service URLs use `fromService: host`, so Render injects each service's
# real hostname at deploy time. That matters because a service only gets the
# clean "name.onrender.com" subdomain when nothing else holds it — otherwise
# Render appends a random suffix. Hardcoding the URLs here would break on the
# next redeploy, so let Render resolve them instead.
#
# The service code accepts a bare hostname without a scheme and assumes https,
# which is what `fromService: host` provides.
#
# Build command is intentionally just `npm install`. These apps have no `build`
# script, and Render's auto-detected "npm install; npm run build" fails with:
#   npm error Missing script: "build"
#
# Persistent data
#  SQLite lives on the container filesystem, so it resets on every deploy, and
#  the free tier has no persistent disk. To persist on a paid plan, mount a
#  Render Disk and add this to each service:
#      disk:
#        name: youpi-data
#        mountPath: /var/data
#        sizeGB: 1
#      envVars:
#        - key: SQLITE_DB_PATH
#          value: /var/data/youpi_pg.sqlite
#
# Admin authentication
#  The merchant admin UI and its /api/* proxy are privileged. Without auth a
#  public URL exposes them to anyone, so Basic Auth is enabled here. Read the
#  generated password from the service's Environment page after the first
#  deploy, or set ADMIN_BASIC_AUTH_PASS yourself.

services:
  - type: web
    name: youpi-payment-api
    runtime: node
    plan: free
    rootDir: apps/payment-api
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_CHECKOUT_URL
        fromService:
          type: web
          name: youpi-checkout
          property: host
      - key: BASE_ADMIN_URL
        fromService:
          type: web
          name: youpi-merchant-admin
          property: host
      - key: BASE_DEMO_STORE_URL
        fromService:
          type: web
          name: youpi-showcase-store
          property: host
      - key: ANDROID_ENROLLMENT_SECRET
        generateValue: true
      - key: YOUPI_WEBHOOK_SECRET
        generateValue: true

  - type: web
    name: youpi-checkout
    runtime: node
    plan: free
    rootDir: apps/checkout-portal
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PAYMENT_API_URL
        fromService:
          type: web
          name: youpi-payment-api
          property: host

  - type: web
    name: youpi-merchant-admin
    runtime: node
    plan: free
    rootDir: apps/merchant-admin
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PAYMENT_API_URL
        fromService:
          type: web
          name: youpi-payment-api
          property: host
      - key: BASE_CHECKOUT_URL
        fromService:
          type: web
          name: youpi-checkout
          property: host
      - key: ADMIN_BASIC_AUTH_USER
        value: admin
      - key: ADMIN_BASIC_AUTH_PASS
        generateValue: true

  - type: web
    name: youpi-showcase-store
    runtime: node
    plan: free
    rootDir: apps/coin-wallet-store
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BASE_PAYMENT_API_URL
        fromService:
          type: web
          name: youpi-payment-api
          property: host
      - key: BASE_CHECKOUT_URL
        fromService:
          type: web
          name: youpi-checkout
          property: host